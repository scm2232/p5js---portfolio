<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My p5.js Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:
radial-gradient(circle at top left,
rgba(99,102,241,0.3),
transparent 40%),
radial-gradient(circle at bottom right,
rgba(59,130,246,0.25),
transparent 40%),
linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:40px 20px;
}

header{
    text-align:center;
    margin-bottom:40px;
}

header h1{
    font-size:3rem;
    margin-bottom:10px;
    letter-spacing:2px;
}

header p{
    color:#cbd5e1;
    font-size:1.1rem;
}

#projects{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.label{
    text-align:center;
    padding:15px;
    font-size:1.2rem;
    font-weight:bold;
    background:rgba(255,255,255,0.08);
}

.preview{
    height:350px;
}

.preview iframe{
    width:100%;
    height:100%;
    border:none;
}

footer{
    text-align:center;
    margin-top:40px;
    color:#cbd5e1;
}

@media(max-width:768px){

    #projects{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>
    <h1>🎨 My p5.js Portfolio</h1>
    <p>Creative Coding Assignment Collection</p>
</header>
<main id="projects">

  <div class="card">
    <div class="label">과제 1</div>
    <div class="preview">
      <iframe src="sample1/index.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="label">과제 4</div>
    <div class="preview">
      <iframe src="sample4/index.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="label">과제 2</div>
    <div class="preview">
      <iframe src="sample2/index.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="label">과제 3</div>
    <div class="preview">
      <iframe src="sample3/index.html"></iframe>
    </div>
  </div>

</main>

<footer>
  <p>2026 p5.js Visual Portfolio</p>
</footer>

</body>
</html>
