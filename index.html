<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My p5.js Portfolio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
  color:white;
  padding:40px 20px;
}

header{
  text-align:center;
  margin-bottom:30px;
}

header h1{
  font-size:2.5rem;
  margin-bottom:10px;
}

header p{
  color:#cbd5e1;
  font-size:1rem;
}

#projects{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.label{
  background:#0f172a;
  color:white;
  text-align:center;
  padding:10px;
  font-weight:bold;
}

.preview{
  position:relative;
  height:350px;
}

.preview iframe{
  width:100%;
  height:100%;
  border:none;
}

footer{
  text-align:center;
  margin-top:30px;
  color:#cbd5e1;
}

@media(max-width:768px){
  #projects{
    grid-template-columns:1fr;
  }

  .preview{
    height:300px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎨 My p5.js Portfolio</h1>
  <p>Creative Coding Assignments Collection</p>
</header>

<main id="projects">

  <div class="card">
    <div class="label">과제 1</div>
    <div class="preview">
      <iframe src="sample1/index.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="label">과제 4</div>
    <div class="preview">
      <iframe src="sample4/index.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="label">과제 2</div>
    <div class="preview">
      <iframe src="sample2/index.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="label">과제 3</div>
    <div class="preview">
      <iframe src="sample3/index.html"></iframe>
    </div>
  </div>

</main>

<footer>
  <p>2026 p5.js Visual Portfolio</p>
</footer>

</body>
</html>
